<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">FIT WITH NASH circular logo</title>
  <desc id="desc">A premium circular fitness logo with a subtle fitness image at 21 percent opacity.</desc>
  <defs>
    <clipPath id="badgeClip"><circle cx="600" cy="600" r="560"/></clipPath>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a20"/>
      <stop offset="1" stop-color="#f03212"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".12"/>
    </filter>
  </defs>
  <circle cx="600" cy="600" r="580" fill="#fffaf6" filter="url(#shadow)"/>
  <g clip-path="url(#badgeClip)">
    <rect width="1200" height="1200" fill="#fffaf6"/>
    <image href="fit-with-nash-logo.png" x="-290" y="0" width="1800" height="1200" preserveAspectRatio="xMidYMid slice" opacity=".21"/>
    <rect width="1200" height="1200" fill="#fffaf6" opacity=".52"/>
  </g>
  <circle cx="600" cy="600" r="560" fill="none" stroke="#f04a1f" stroke-width="18"/>
  <g transform="translate(390 248)" fill="url(#orange)">
    <path d="M69 0h270l-42 72H106z"/>
    <path d="M48 103h241l-41 70H88L0 324H-83z"/>
    <path d="M225 102h60l-84 222h-60z"/>
    <path d="M52 206h66l45 72 45-72h67l-112 176z"/>
  </g>
  <text x="600" y="690" text-anchor="middle" fill="#202124" font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="800" letter-spacing="3">FIT WITH</text>
  <text x="600" y="826" text-anchor="middle" fill="#202124" font-family="Arial, Helvetica, sans-serif" font-size="142" font-weight="900" letter-spacing="5">NASH</text>
  <path d="M384 870h432" stroke="#f04a1f" stroke-width="10" stroke-linecap="round"/>
</svg>
