version: "3.9"
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi123
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  strapi:
    image: strapi/strapi:5.15.0
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DATABASE: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi123
      DATABASE_SSL: "false"
    ports:
      - "1337:1337"
    volumes:
      - ./content-types.json:/usr/src/app/content-types.json:ro
    restart: unless-stopped

volumes:
  pg_data: